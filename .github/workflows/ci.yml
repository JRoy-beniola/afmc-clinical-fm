name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install PyYAML pytest ruff
      - run: pip install -e . --no-deps
      - run: ruff check src tests tools/reproducibility
      - run: pytest tests/reproducibility -q
      - name: Bootstrap audited historical report sources
        run: |
          set -euo pipefail
          python tools/reproducibility/bootstrap_reports.py phase0 --root . --destination /tmp/r2-bootstrap/phase0
          python tools/reproducibility/bootstrap_reports.py phase05 --root . --destination /tmp/r2-bootstrap/phase05
          python tools/reproducibility/bootstrap_reports.py phase06 --root . --destination /tmp/r2-bootstrap/phase06
          python - <<'PY'
          from pathlib import Path

          from afmc_fm.reproducibility.registry import get_phase
          from afmc_fm.reproducibility.report_audit import audit_report_source

          for phase_id in ("phase0", "phase05", "phase06"):
              report = audit_report_source(
                  Path("."),
                  get_phase(phase_id),
                  Path("/tmp/r2-bootstrap") / phase_id,
                  accept=True,
              )
              failures = [check for check in report.checks if not check.ok]
              if failures:
                  details = "; ".join(f"{item.code}: {item.detail}" for item in failures)
                  raise SystemExit(f"{phase_id} report-source audit failed: {details}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r2-report-sources
          path: /tmp/r2-bootstrap
          if-no-files-found: error
      - name: Commit audited report sources to reproducibility branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            if (!pr || pr.head.ref !== 'reproducibility-closure-through-post06') {
              core.setFailed('report-source commit step is restricted to the reproducibility branch');
              return;
            }
            const parent = pr.head.sha;
            const parentCommit = await github.rest.git.getCommit({owner, repo, commit_sha: parent});
            const entries = [];
            for (const phase of ['phase0', 'phase05', 'phase06']) {
              for (const name of ['report-source.md', 'report.yaml', 'extraction.json']) {
                const local = `/tmp/r2-bootstrap/${phase}/${name}`;
                const content = fs.readFileSync(local, 'utf8');
                const blob = await github.rest.git.createBlob({owner, repo, content, encoding: 'utf-8'});
                entries.push({
                  path: `docs/reproducibility/${phase}/${name}`,
                  mode: '100644',
                  type: 'blob',
                  sha: blob.data.sha,
                });
              }
            }
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.data.tree.sha,
              tree: entries,
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'docs: recover audited historical report sources',
              tree: tree.data.sha,
              parents: [parent],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${pr.head.ref}`,
              sha: commit.data.sha,
            });
            core.notice(`Committed audited report sources at ${commit.data.sha}`);
